<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TXT Book Reader — Alpine.js + Bootstrap</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root{
      --page-width: 100vw;                    /* updated at runtime to reader width */
      --page-height: calc(100vh - 160px);     /* toolbar + footer allowance */
      --page-padding: 24px;
      --base-font-size: 18px;
      --line-height: 1.62;
      --page-bg: #ffffff;
      --page-fg: #111111;
    }
    .theme-light { --page-bg:#ffffff; --page-fg:#111111; }
    .theme-sepia { --page-bg:#f6f0e6; --page-fg:#3a2e22; }
    .theme-dark  { --page-bg:#0f1014; --page-fg:#e8e8ea; }

    html, body { height:100%; background:var(--page-bg); color:var(--page-fg); }
    .shell { display:flex; flex-direction:column; height:100vh; }
    .toolbar { flex:0 0 auto; position:sticky; top:0; z-index:5; background:var(--page-bg);
               border-bottom:1px solid rgba(0,0,0,.08); padding:.5rem .75rem; }
    .area { flex:1 1 auto; overflow:hidden; position:relative; background:var(--page-bg); color:var(--page-fg); }

    /* NEW: true paginated layout (no CSS columns) */
    .pages {
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      gap: 0; /* contiguous pages */
      height: var(--page-height);
      background: var(--page-bg);
      color: var(--page-fg);
    }
    .page {
      flex: 0 0 var(--page-width);
      height: var(--page-height);
      padding: var(--page-padding);
      scroll-snap-align: start;
      font-size: var(--base-font-size);
      line-height: var(--line-height);
      white-space: normal;
      overflow: hidden;
      position: relative;
    }
    .page::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 76px;
      height: 76px;
      pointer-events: none;
      background: radial-gradient(circle at top right,
        rgba(255, 255, 255, 0.85) 0%,
        rgba(255, 255, 255, 0.4) 55%,
        rgba(255, 255, 255, 0) 75%);
      opacity: 0;
      transform-origin: 100% 0;
      transform: translate(60%, -60%) rotate(6deg) scale(0.6);
      filter: drop-shadow(-4px 6px 6px rgba(0, 0, 0, 0.18));
    }
    .theme-dark .page::after {
      background: radial-gradient(circle at top right,
        rgba(232, 232, 234, 0.55) 0%,
        rgba(232, 232, 234, 0.22) 55%,
        rgba(232, 232, 234, 0) 75%);
      filter: drop-shadow(-4px 6px 6px rgba(0, 0, 0, 0.35));
    }
    .page--corner-flip::after {
      animation: pageCornerFlip 450ms ease-out forwards;
    }
    @keyframes pageCornerFlip {
      0% {
        opacity: 0;
        transform: translate(62%, -62%) rotate(0deg) scale(0.5);
      }
      40% {
        opacity: 0.9;
        transform: translate(18%, -18%) rotate(14deg) scale(1.05);
      }
      70% {
        opacity: 0.7;
        transform: translate(28%, -28%) rotate(10deg) scale(0.92);
      }
      100% {
        opacity: 0;
        transform: translate(62%, -62%) rotate(16deg) scale(1.12);
      }
    }
    .page h1, .page h2, .page h3 {
      margin-top:1.1em; margin-bottom:.55em;
      break-inside: avoid;
    }
    .page p, .page ul, .page ol, .page blockquote { orphans:3; widows:3; }
    .page hr { border:0; border-top:1px dashed currentColor; opacity:.4; margin:1.25rem 0; }
    .page img { max-width:100%; height:auto; }

    .footer { flex:0 0 auto; border-top:1px solid rgba(0,0,0,.08); padding:.35rem .75rem; background:var(--page-bg); }
    .page-nav-btn { position:absolute; top:50%; transform:translateY(-50%); z-index:10; opacity:.85; }
    .page-prev { left:.5rem; } .page-next { right:.5rem; }
    @media (max-width:576px){ .page-nav-btn{ display:none; } }

    .toolbar .form-select,
    .toolbar .form-control,
    .toolbar .input-group-text {
      background-color: var(--page-bg);
      color: var(--page-fg);
      border-color: rgba(0, 0, 0, 0.12);
    }
    .toolbar .form-select:focus,
    .toolbar .form-control:focus {
      background-color: var(--page-bg);
      color: var(--page-fg);
      border-color: rgba(17, 113, 239, 0.55);
      box-shadow: 0 0 0 0.2rem rgba(17, 113, 239, 0.18);
    }
    .toolbar .input-group-text {
      border-right-width: 0;
    }
    .toolbar .btn-outline-primary {
      color: var(--page-fg);
      border-color: rgba(17, 113, 239, 0.6);
    }
    .toolbar .btn-outline-primary:hover,
    .toolbar .btn-outline-primary:focus {
      background-color: rgba(17, 113, 239, 0.12);
      color: var(--page-fg);
    }
    .toolbar .text-muted {
      color: var(--page-fg) !important;
      opacity: 0.72;
    }
    .theme-dark .toolbar .text-muted {
      opacity: 0.65;
    }
    .theme-sepia .toolbar .text-muted {
      opacity: 0.7;
    }
    .theme-sepia .toolbar .form-select,
    .theme-sepia .toolbar .form-control,
    .theme-sepia .toolbar .input-group-text {
      border-color: rgba(58, 46, 34, 0.24);
    }
    .theme-sepia .toolbar .form-select:focus,
    .theme-sepia .toolbar .form-control:focus {
      border-color: rgba(154, 116, 79, 0.6);
      box-shadow: 0 0 0 0.2rem rgba(154, 116, 79, 0.2);
    }
    .theme-sepia .toolbar .btn-outline-primary {
      border-color: rgba(154, 116, 79, 0.6);
      color: rgba(154, 116, 79, 0.9);
    }
    .theme-sepia .toolbar .btn-outline-primary:hover,
    .theme-sepia .toolbar .btn-outline-primary:focus {
      background-color: rgba(154, 116, 79, 0.12);
    }
    .theme-dark .toolbar .form-select,
    .theme-dark .toolbar .form-control,
    .theme-dark .toolbar .input-group-text {
      border-color: rgba(255, 255, 255, 0.18);
    }
    .theme-dark .toolbar .form-select:focus,
    .theme-dark .toolbar .form-control:focus {
      border-color: rgba(102, 179, 255, 0.6);
      box-shadow: 0 0 0 0.2rem rgba(102, 179, 255, 0.25);
    }
    .theme-dark .toolbar .btn-outline-primary {
      border-color: rgba(102, 179, 255, 0.6);
      color: rgba(147, 198, 255, 0.95);
    }
    .theme-dark .toolbar .btn-outline-primary:hover,
    .theme-dark .toolbar .btn-outline-primary:focus {
      background-color: rgba(102, 179, 255, 0.18);
      color: rgba(147, 198, 255, 0.98);
    }

    .toc-offcanvas .offcanvas-body a { text-decoration:none; }
    .toc-offcanvas .list-group-item {
      background-color: var(--page-bg);
      color: var(--page-fg);
      border-color: rgba(0, 0, 0, 0.08);
    }
    .toc-offcanvas .list-group-item:hover,
    .toc-offcanvas .list-group-item:focus {
      background-color: rgba(0, 0, 0, 0.03);
      color: var(--page-fg);
    }
    .theme-sepia .toc-offcanvas .list-group-item {
      border-color: rgba(58, 46, 34, 0.18);
    }
    .theme-sepia .toc-offcanvas .list-group-item:hover,
    .theme-sepia .toc-offcanvas .list-group-item:focus {
      background-color: rgba(58, 46, 34, 0.08);
    }
    .theme-dark .toc-offcanvas .list-group-item {
      border-color: rgba(255, 255, 255, 0.12);
    }
    .theme-dark .toc-offcanvas .list-group-item:hover,
    .theme-dark .toc-offcanvas .list-group-item:focus {
      background-color: rgba(255, 255, 255, 0.12);
      color: var(--page-fg);
    }
    .footnote-inline {
      display: inline;
      white-space: nowrap;
    }
    .popover { color:#111; }
    .theme-light .offcanvas,
    .theme-sepia .offcanvas,
    .theme-dark .offcanvas {
      background: var(--page-bg);
      color: var(--page-fg);
    }
    .theme-dark .offcanvas {
      border-color: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body
  x-data="reader()"
  x-init="init()"
  :class="themeClass"
  x-on:reader:load-requested="handleLoadRequest($event.detail)"
  x-on:reader:file-selected="handleFileSelected($event.detail)"
  x-on:reader:provider-encoding-changed="handleProviderEncodingChange($event.detail)"
  x-on:reader:font-size-set="handleFontSizeSet($event.detail)"
  x-on:reader:theme-set="handleThemeSet($event.detail)"
  x-on:reader:goto-heading="goto($event.detail && $event.detail.id)"
>

  <!-- TOC Drawer -->
  <div
    class="offcanvas offcanvas-start toc-offcanvas"
    tabindex="-1"
    id="tocDrawer"
    aria-labelledby="tocDrawerLabel"
    x-data="readerToc()"
  >
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="tocDrawerLabel" x-text="$store?.strings?.tocDrawerTitle || 'Contents'"></h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div class="list-group" x-show="entries.length">
        <template x-for="entry in entries" :key="entry.id">
          <a href="" class="list-group-item list-group-item-action" x-on:click.prevent="handleEntryClick(entry.id)">
            <small class="text-muted" x-text="entry.level"></small>&nbsp;<span x-text="entry.text"></span>
          </a>
        </template>
      </div>
      <p class="text-muted m-0" x-show="entries.length === 0" x-text="emptyMessage"></p>
    </div>
  </div>

  <div class="shell">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="d-flex flex-wrap align-items-center gap-2">
        <button class="btn btn-outline-secondary" data-bs-toggle="offcanvas" data-bs-target="#tocDrawer">
          <i class="bi bi-list"></i> <span x-text="$store?.strings?.tocButton || 'TOC'"></span>
        </button>

        <div class="ms-1 me-auto">
          <strong x-text="bookTitle || 'Untitled'"></strong>
          <span class="text-muted ms-2" x-show="bookAuthor">
            <span>by </span><span x-text="bookAuthor"></span>
          </span>
          <span class="text-muted ms-3" x-text="pageDisplay()"></span>
        </div>

        <div class="d-flex align-items-center gap-2 flex-wrap" x-data="readerToolbar()">
          <div class="input-group input-group-sm" style="width: 230px;">
            <span class="input-group-text" x-text="$store?.strings?.providerLabel || 'Provider'"></span>
            <select class="form-select" x-model="provider" x-on:change="handleProviderChange($event)">
              <template x-for="option in providerOptions" :key="option.value">
                <option :value="option.value" x-text="option.label"></option>
              </template>
            </select>
          </div>

          <div class="input-group input-group-sm" style="width: 210px;">
            <span class="input-group-text" x-text="$store?.strings?.encodingLabel || 'Encoding'"></span>
            <select class="form-select" x-model="encoding" x-on:change="handleEncodingChange($event)">
              <template x-for="option in encodingOptions" :key="option.value">
                <option :value="option.value" x-text="option.label"></option>
              </template>
            </select>
          </div>

          <div class="input-group input-group-sm" style="width: 420px;">
            <span class="input-group-text" x-text="$store?.strings?.urlLabel || 'URL'"></span>
            <input type="url" class="form-control" :placeholder="$store?.strings?.urlPlaceholder || 'https://.../book.txt'" x-model="loadUrl" x-on:input="handleUrlInput($event)">
            <button class="btn btn-outline-primary" type="button" x-on:click="handleLoadButtonClick()" x-text="$store?.strings?.loadButton || 'Load'"></button>
          </div>

          <div class="input-group input-group-sm" style="width: 300px;">
            <input class="form-control" type="file" accept=".txt,text/plain" x-ref="fileInput"
                   x-on:change="handleFileChange($event)">
            <button class="btn btn-outline-primary" type="button" x-on:click="triggerFileDialog()" x-text="$store?.strings?.chooseFileButton || 'Choose .txt'"></button>
          </div>

          <div class="d-flex align-items-center gap-2">
            <label class="form-label m-0" :title="$store?.strings?.fontIconLabel || 'Font size'"><i class="bi bi-type"></i></label>
            <input type="range" class="form-range" min="14" max="26" step="1" x-model.number="fontSize"
                   x-on:input="handleFontSizeInput($event)" style="width: 120px;">
          </div>

          <div class="d-flex align-items-center gap-2">
            <label class="form-label m-0" :title="$store?.strings?.themeIconLabel || 'Theme'"><i class="bi bi-palette"></i></label>
            <select class="form-select form-select-sm" x-model="theme" x-on:change="handleThemeChange($event)">
              <template x-for="option in themeOptions" :key="option.value">
                <option :value="option.value" x-text="option.label"></option>
              </template>
            </select>
          </div>
        </div>
      </div>

      <div class="mt-2 w-100" x-data="appNotifications()" x-on:app:notify="add($event.detail)">
        <template x-for="note in items" :key="note.id">
          <div class="alert alert-warning d-flex align-items-center justify-content-between py-2 px-3 mb-2" role="alert">
            <span x-text="note.message"></span>
            <button type="button" class="btn-close" aria-label="Close" x-on:click="dismiss(note.id)"></button>
          </div>
        </template>
      </div>
    </div>

    <!-- Reading Area -->
    <div class="area">
      <button class="btn btn-light page-nav-btn page-prev" x-on:click="prevPage()" :title="$store?.strings?.prevButtonTitle || 'Previous page'"><i class="bi bi-chevron-left"></i></button>
      <button class="btn btn-light page-nav-btn page-next" x-on:click="nextPage()" :title="$store?.strings?.nextButtonTitle || 'Next page'"><i class="bi bi-chevron-right"></i></button>

      <!-- New pages container (no x-html) -->
      <div id="readerPages" class="pages" x-ref="readerPages"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="d-flex align-items-center gap-3">
        <div class="flex-grow-1">
          <div class="progress" role="progressbar" :aria-valuenow="progressPercent()" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar" :style="`width:${progressPercent()}%`"></div>
          </div>
        </div>
        <div style="min-width:70px" class="text-end" x-text="Math.round(progressPercent()) + '%'"></div>
        <div style="min-width:70px" class="text-end" x-text="progressPageSummary()" aria-label="Page count" data-test="progress-pages"></div>
      </div>
    </div>
  </div>

  <!-- Popper + Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

  <!-- App -->
  <script type="module" src="js/app.js"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.7/dist/cdn.min.js"></script>
</body>
</html>
